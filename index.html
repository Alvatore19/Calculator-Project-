<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

        <link rel="icon" type="image/svg+xml" href="../media/calculator.svg" />

        <title>Calculadora</title>
    </head>
    <body class="bg-white text-[#ABB2BF] min-h-screen font-mono">
        <main class="max-w-7xl mx-auto px-4">
            <header class="w-full py-4 px-6 absolute top-0 left-0">
                <a
                    href="https://alejandromyportfolio.netlify.app/"
                    class="inline-flex items-center gap-2 px-4 py-2 text-[#ABB2BF] hover:text-white hover:bg-white/5 rounded-md transition-colors duration-200"
                    aria-label="Volver al sitio principal"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="m15 18-6-6 6-6" />
                    </svg>
                    <span class="font-bold text-sm text-[#C778DD]">Volver al portafolio</span>
                </a>
            </header>
            <!-- Contenido de Calculadora -->
            <section class="flex justify-center items-center min-h-screen py-20 gap-6">
                <!-- Area de visualizacion -->
                <div class="w-full sm:w-3/5 md:w-2/5 border border-1 border-[#C778DD] rounded-md bg-[#282C33]">
                    <h1 class="text-center text-2xl font-bold text-[#C778DD] py-4">Calculadora</h1>
                    <!-- Area de resultados -->
                    <div class="px-8 py-4">
                        <div class="bg-white/10 rounded-md p-4">
                            <output class="text-right text-xl font-bold text-[#ABB2BF] select-none"> 0 </output>
                        </div>
                    </div>
                    <!-- Area de botones -->
                    <div class="px-4 py-2">
                        <div class="grid grid-cols-4 gap-2 p-4">
                            <!-- Area algebraica -->
                            <!-- Fila 1 -->
                            <button
                                aria-label="Raíz cuadrada"
                                data-action="sqrt"
                                class="focus:outline-none focus:ring-2 focus:ring-[#C778DD] bg-[#3E4451] text-[#ABB2BF] py-2 rounded-md hover:bg-[#2c313a]"
                                ><svg
                                    class="mx-auto"
                                    width="24"
                                    height="24"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >
                                    <path d="M3 12h2l4 8 7-16h5" />
                                </svg>
                            </button>
                            <button
                                aria-label="Potencia"
                                data-action="^"
                                class="focus:outline-none focus:ring-2 focus:ring-[#C778DD] bg-[#3E4451] text-[#ABB2BF] py-2 rounded-md hover:bg-[#2c313a]"
                                ><svg
                                    class="mx-auto"
                                    width="24"
                                    height="24"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >
                                    <path d="M6 10l6 6M12 10l-6 6" />
                                    <path d="M15 4l3 3-3 0 3-3" />
                                </svg>
                            </button>
                            <button
                                aria-label="Pi"
                                data-action="π"
                                class="focus:outline-none focus:ring-2 focus:ring-[#C778DD] bg-[#3E4451] text-[#ABB2BF] py-2 rounded-md hover:bg-[#2c313a]"
                                ><svg
                                    class="mx-auto"
                                    width="24"
                                    height="24"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >
                                    <path d="M9 18V6H17" />
                                    <path d="M15 18V6" />
                                    <path d="M6 6h12" />
                                </svg>
                            </button>
                            <button
                                aria-label="Función"
                                data-action="f(x)"
                                class="focus:outline-none focus:ring-2 focus:ring-[#C778DD] bg-[#3E4451] text-[#ABB2BF] py-2 rounded-md hover:bg-[#2c313a]"
                                >F(x)</button
                            >

                            <!-- Fila 2 -->
                            <button
                                aria-label="Logaritmo"
                                data-action="log"
                                class="focus:outline-none focus:ring-2 focus:ring-[#C778DD] bg-[#3E4451] text-[#ABB2BF] py-2 rounded-md hover:bg-[#2c313a]"
                                >log</button
                            >
                            <button
                                aria-label="Logaritmo natural"
                                data-action="ln"
                                class="focus:outline-none focus:ring-2 focus:ring-[#C778DD] bg-[#3E4451] text-[#ABB2BF] py-2 rounded-md hover:bg-[#2c313a]"
                                >ln</button
                            >
                            <button
                                aria-label="Paréntesis abierto"
                                data-action="("
                                class="focus:outline-none focus:ring-2 focus:ring-[#C778DD] bg-[#3E4451] text-[#ABB2BF] py-2 rounded-md hover:bg-[#2c313a]"
                                >(</button
                            >
                            <button
                                aria-label="Paréntesis cerrado"
                                data-action=")"
                                class="focus:outline-none focus:ring-2 focus:ring-[#C778DD] bg-[#3E4451] text-[#ABB2BF] py-2 rounded-md hover:bg-[#2c313a]"
                                >)</button
                            >

                            <!-- Fila 3 -->
                            <button
                                aria-label="Integral"
                                data-action="∫"
                                class="focus:outline-none focus:ring-2 focus:ring-[#C778DD] bg-[#3E4451] text-[#ABB2BF] py-2 rounded-md hover:bg-[#2c313a]"
                            >
                                <svg
                                    class="mx-auto"
                                    xmlns="http://www.w3.org/2000/svg"
                                    viewBox="0 0 24 24"
                                    width="24"
                                    height="24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >
                                    <path d="M14 3c-2 0-3 1-3 3v12c0 2-1 3-3 3" />
                                </svg>
                            </button>
                            <button
                                aria-label="Seno"
                                data-action="sen"
                                class="focus:outline-none focus:ring-2 focus:ring-[#C778DD] bg-[#3E4451] text-[#ABB2BF] py-2 rounded-md hover:bg-[#2c313a]"
                                >sen</button
                            >
                            <button
                                aria-label="Coseno"
                                data-action="cos"
                                class="focus:outline-none focus:ring-2 focus:ring-[#C778DD] bg-[#3E4451] text-[#ABB2BF] py-2 rounded-md hover:bg-[#2c313a]"
                                >cos</button
                            >
                            <button
                                aria-label="Tangente"
                                data-action="tan"
                                class="focus:outline-none focus:ring-2 focus:ring-[#C778DD] bg-[#3E4451] text-[#ABB2BF] py-2 rounded-md hover:bg-[#2c313a]"
                                >tan</button
                            >
                        </div>
                    </div>

                    <!-- Area aritmetica -->
                    <div class="px-4 py-2">
                        <div class="grid grid-cols-4 gap-2 p-4">
                            <!-- Fila 1 -->
                            <button
                                aria-label="7"
                                data-number="7"
                                class="focus:outline-none focus:ring-2 focus:ring-[#C778DD] bg-[#3E4451] text-[#ABB2BF] py-2 rounded-md hover:bg-[#2c313a]"
                                >7</button
                            >
                            <button
                                aria-label="8"
                                data-number="8"
                                class="focus:outline-none focus:ring-2 focus:ring-[#C778DD] bg-[#3E4451] text-[#ABB2BF] py-2 rounded-md hover:bg-[#2c313a]"
                                >8</button
                            >
                            <button
                                aria-label="9"
                                data-number="9"
                                class="focus:outline-none focus:ring-2 focus:ring-[#C778DD] bg-[#3E4451] text-[#ABB2BF] py-2 rounded-md hover:bg-[#2c313a]"
                                >9</button
                            >
                            <button
                                aria-label="División"
                                data-operator="/"
                                class="focus:outline-none focus:ring-2 focus:ring-[#C778DD] bg-[#C778DD] text-white py-2 rounded-md hover:bg-[#b263c3]"
                                >÷</button
                            >

                            <!-- Fila 2 -->
                            <button
                                aria-label="4"
                                data-number="4"
                                class="focus:outline-none focus:ring-2 focus:ring-[#C778DD] bg-[#3E4451] text-[#ABB2BF] py-2 rounded-md hover:bg-[#2c313a]"
                                >4</button
                            >
                            <button
                                aria-label="5"
                                data-number="5"
                                class="focus:outline-none focus:ring-2 focus:ring-[#C778DD] bg-[#3E4451] text-[#ABB2BF] py-2 rounded-md hover:bg-[#2c313a]"
                                >5</button
                            >
                            <button
                                aria-label="6"
                                data-number="6"
                                class="focus:outline-none focus:ring-2 focus:ring-[#C778DD] bg-[#3E4451] text-[#ABB2BF] py-2 rounded-md hover:bg-[#2c313a]"
                                >6</button
                            >
                            <button
                                aria-label="Multiplicación"
                                data-operator="*"
                                class="focus:outline-none focus:ring-2 focus:ring-[#C778DD] bg-[#C778DD] text-white py-2 rounded-md hover:bg-[#b263c3]"
                                >x</button
                            >

                            <!-- Fila 3 -->
                            <button
                                aria-label="1"
                                data-number="1"
                                class="focus:outline-none focus:ring-2 focus:ring-[#C778DD] bg-[#3E4451] text-[#ABB2BF] py-2 rounded-md hover:bg-[#2c313a]"
                                >1</button
                            >
                            <button
                                aria-label="2"
                                data-number="2"
                                class="focus:outline-none focus:ring-2 focus:ring-[#C778DD] bg-[#3E4451] text-[#ABB2BF] py-2 rounded-md hover:bg-[#2c313a]"
                                >2</button
                            >
                            <button
                                aria-label="3"
                                data-number="3"
                                class="focus:outline-none focus:ring-2 focus:ring-[#C778DD] bg-[#3E4451] text-[#ABB2BF] py-2 rounded-md hover:bg-[#2c313a]"
                                >3</button
                            >
                            <button
                                aria-label="Resta"
                                data-operator="-"
                                class="focus:outline-none focus:ring-2 focus:ring-[#C778DD] bg-[#C778DD] text-white py-2 rounded-md hover:bg-[#b263c3]"
                                >-</button
                            >

                            <!-- Fila 4 -->
                            <button
                                aria-label="0"
                                data-number="0"
                                class="focus:outline-none focus:ring-2 focus:ring-[#C778DD] bg-[#3E4451] text-[#ABB2BF] py-2 rounded-md col-span-2 hover:bg-[#2c313a]"
                                >0</button
                            >
                            <button
                                aria-label="Punto"
                                data-number="."
                                class="focus:outline-none focus:ring-2 focus:ring-[#C778DD] bg-[#3E4451] text-[#ABB2BF] py-2 rounded-md hover:bg-[#2c313a] col-span-1"
                                >.</button
                            >
                            <button
                                aria-label="Suma"
                                data-operator="+"
                                class="focus:outline-none focus:ring-2 focus:ring-[#C778DD] bg-[#C778DD] text-white py-2 rounded-md hover:bg-[#b263c3]"
                                >+</button
                            >

                            <!-- Fila 5 -->
                            <button
                                aria-label="Igual"
                                data-action="="
                                class="focus:outline-none focus:ring-2 focus:ring-[#C778DD] bg-[#E06C75] text-white font-bold py-2 rounded-md col-span-2 hover:bg-[#c75e69]"
                                >=</button
                            >
                            <button
                                aria-label="Borrar"
                                data-action="Del"
                                class="focus:outline-none focus:ring-2 focus:ring-[#C778DD] bg-[#E06C75] text-white font-bold py-2 rounded-md col-span-1 hover:bg-[#c75e69]"
                                >Del</button
                            >
                            <button
                                aria-label="BorrarTodo"
                                data-action="C"
                                class="focus:outline-none focus:ring-2 focus:ring-[#C778DD] bg-[#E06C75] text-white font-bold py-2 rounded-md col-span-1 hover:bg-[#c75e69]"
                                >C</button
                            >
                        </div>
                    </div>
                </div>
            </section>
        </main>
        <script src="../js/script.js"></script>
    </body>
</html>
